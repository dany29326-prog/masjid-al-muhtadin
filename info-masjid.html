<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Info Masjid - Masjid Al Muhtadin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f7f9fa; display: flex; justify-content: center; min-height: 100vh; color: #2d3748; }
        .app-container { width: 100%; max-width: 480px; background-color: #f7f9fa; min-height: 100vh; padding-bottom: 40px; position: relative; }
        .header { background: linear-gradient(135deg, #043927 0%, #065a3e 100%); padding: 30px 24px 45px 24px; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; color: white; position: relative; z-index: 2; }
        .header-top { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
        .back-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); display: flex; justify-content: center; align-items: center; border: none; color: white; cursor: pointer; text-decoration: none; }
        .header-title { font-size: 1.25rem; font-weight: 700; }
        .content { margin-top: -20px; padding: 0 20px; position: relative; z-index: 3; }
        
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tab-container::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 8px 16px; background: white; border: 1px solid #edf2f7; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: #718096; white-space: nowrap; cursor: pointer; }
        .tab-btn.active { background: #043927; color: white; border-color: #043927; }

        .feed-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 16px; }
        .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .feed-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
        .badge-kajian { background: rgba(212, 175, 55, 0.15); color: #b8943a; }
        .badge-sosial { background: rgba(229, 62, 62, 0.1); color: #e53e3e; }
        .badge-info { background: rgba(49, 130, 206, 0.1); color: #3182ce; }
        .feed-date { font-size: 0.75rem; color: #a0aec0; }
        .feed-title { font-size: 1.05rem; font-weight: 700; color: #0c1a30; margin-bottom: 8px; line-height: 1.4; }
        .feed-desc { font-size: 0.85rem; color: #718096; line-height: 1.6; margin-bottom: 15px; }
        .feed-image { width: 100%; height: auto; border-radius: 12px; margin-bottom: 15px; object-fit: cover; }
        
        .feed-meta { display: flex; align-items: center; gap: 15px; border-top: 1px dashed #edf2f7; padding-top: 15px; }
        .meta-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #718096; }
        .meta-item svg { width: 16px; height: 16px; color: #043927; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-top">
                <a href="index.html" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <h1 class="header-title">Info Masjid</h1>
            </div>
        </div>

        <div class="content">
            <div class="tab-container" id="tab-container" style="display: none;">
                <div class="tab-btn active" onclick="filterFeed('Semua')">Semua</div>
                <div class="tab-btn" onclick="filterFeed('Kajian')">Kajian</div>
                <div class="tab-btn" onclick="filterFeed('Sosial')">Sosial</div>
                <div class="tab-btn" onclick="filterFeed('Pengumuman')">Pengumuman</div>
            </div>

            <div id="feed-container">
                <div style="text-align: center; padding: 40px 20px; color: #718096;">
                    Memuat informasi masjid...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzDxO8T_KJq06d5iXzu6cIVq7_LoVLOkie-P8gTAeKms5yJYkV-ppvkFy-W2k4B4Ju5Ag/exec";
        let allFeeds = [];

        async function fetchInfoMasjid() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Assuming data.value is an array of arrays
                // Index mapping based on standard: 
                // 2: Jenis Data, 3: Judul, 4: Kategori, 5: Deskripsi, 6: Link Gambar, 10: Tanggal (or 0 for Timestamp)
                const rows = data.value;
                if (!rows || rows.length <= 1) {
                    document.getElementById('feed-container').innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #718096;">Belum ada informasi.</div>';
                    return;
                }

                // Skip header row (index 0)
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row[2] === "Info Kemasjidan") {
                        allFeeds.push({
                            judul: row[3],
                            kategori: row[4],
                            deskripsi: row[5],
                            gambar: row[6],
                            tanggal: row[10] || row[0] // fallback to timestamp
                        });
                    }
                }

                // Sort newest first
                allFeeds.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

                document.getElementById('tab-container').style.display = 'flex';
                renderFeeds(allFeeds);

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('feed-container').innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #e53e3e;">Gagal memuat data. Silakan coba lagi nanti.</div>';
            }
        }

        function filterFeed(kategori) {
            // Update active tab UI
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                if (tab.innerText === kategori) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            // Filter data
            if (kategori === 'Semua') {
                renderFeeds(allFeeds);
            } else {
                const filtered = allFeeds.filter(f => f.kategori && f.kategori.toLowerCase().includes(kategori.toLowerCase()));
                renderFeeds(filtered);
            }
        }

        function renderFeeds(feeds) {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            if (feeds.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #718096;">Belum ada informasi di kategori ini.</div>';
                return;
            }

            feeds.forEach(feed => {
                // Determine badge style
                let badgeClass = 'badge-info';
                let catName = feed.kategori || 'INFO';
                if (catName.toLowerCase().includes('kajian')) badgeClass = 'badge-kajian';
                else if (catName.toLowerCase().includes('sosial')) badgeClass = 'badge-sosial';

                // Format date manually as it could be ISO string
                let dateStr = "Hari ini";
                try {
                    const d = new Date(feed.tanggal);
                    dateStr = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                } catch(e){}

                let imageHtml = '';
                if (feed.gambar && feed.gambar.trim() !== '') {
                    imageHtml = `<img src="${feed.gambar}" alt="Flyer" class="feed-image" onerror="this.style.display='none'">`;
                }

                const cardHtml = `
                    <div class="feed-card">
                        <div class="feed-header">
                            <span class="feed-badge ${badgeClass}">${catName.toUpperCase()}</span>
                            <span class="feed-date">${dateStr}</span>
                        </div>
                        <h3 class="feed-title">${feed.judul}</h3>
                        ${imageHtml}
                        <p class="feed-desc">${feed.deskripsi}</p>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Initialize
        fetchInfoMasjid();
    </script>
</body>
</html>
