<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Info Keuangan - Masjid Al Muhtadin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f7f9fa; display: flex; justify-content: center; min-height: 100vh; color: #2d3748; }
        .app-container { width: 100%; max-width: 480px; background-color: #f7f9fa; min-height: 100vh; padding-bottom: 40px; position: relative; }
        .header { background: linear-gradient(135deg, #043927 0%, #065a3e 100%); padding: 30px 24px 60px 24px; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; color: white; position: relative; z-index: 1; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .back-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); display: flex; justify-content: center; align-items: center; border: none; color: white; cursor: pointer; text-decoration: none; }
        .header-title { font-size: 1.25rem; font-weight: 700; flex-grow: 1; text-align: center; margin-right: 40px; }
        
        .saldo-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin: -40px 20px 20px 20px; position: relative; z-index: 2; text-align: center; }
        .saldo-label { color: #718096; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .saldo-amount { color: #043927; font-size: 2rem; font-weight: 700; margin-bottom: 15px; }
        .saldo-month { display: inline-block; padding: 6px 15px; background: #edf2f7; border-radius: 20px; font-size: 0.8rem; color: #4a5568; font-weight: 600; }

        .content { padding: 0 20px; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; margin-top: 10px; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #0c1a30; }
        .section-total { font-weight: 700; }
        .total-in { color: #043927; }
        .total-out { color: #e53e3e; }

        .transaction-card { background: white; border-radius: 16px; padding: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; overflow: hidden; }
        .trx-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #edf2f7; }
        .trx-item:last-child { border-bottom: none; }
        
        .trx-info { display: flex; align-items: center; gap: 15px; }
        .trx-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .icon-in { background: rgba(4, 57, 39, 0.1); color: #043927; }
        .icon-out { background: rgba(229, 62, 62, 0.1); color: #e53e3e; }
        .trx-icon svg { width: 20px; height: 20px; }
        
        .trx-details h4 { color: #2d3748; font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
        .trx-details p { color: #a0aec0; font-size: 0.75rem; }
        
        .trx-amount { font-weight: 700; font-size: 0.95rem; }
        .amount-in { color: #043927; }
        .amount-out { color: #e53e3e; }

        .summary-box { background: #043927; border-radius: 16px; padding: 20px; color: white; display: flex; justify-content: space-between; margin-bottom: 30px; }
        .summary-item { text-align: center; flex: 1; }
        .summary-item:first-child { border-right: 1px solid rgba(255,255,255,0.2); }
        .summary-label { font-size: 0.75rem; opacity: 0.8; margin-bottom: 5px; }
        .summary-value { font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-top">
                <a href="index.html" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <h1 class="header-title">Laporan Keuangan</h1>
            </div>
        </div>

        <div class="saldo-card">
            <div class="saldo-label">Total Saldo Kas Masjid</div>
            <div class="saldo-amount" id="total-saldo">Rp 0</div>
            <div class="saldo-month" id="current-month">Memuat...</div>
        </div>

        <div class="content" id="keuangan-content" style="display: none;">
            
            <div class="summary-box">
                <div class="summary-item">
                    <div class="summary-label">Total Pemasukan</div>
                    <div class="summary-value" id="total-in">+ Rp 0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Total Pengeluaran</div>
                    <div class="summary-value" id="total-out">- Rp 0</div>
                </div>
            </div>

            <div class="section-header">
                <h2 class="section-title">Pemasukan</h2>
            </div>
            <div class="transaction-card" id="list-in">
                <!-- Data Pemasukan -->
            </div>

            <div class="section-header">
                <h2 class="section-title">Pengeluaran</h2>
            </div>
            <div class="transaction-card" id="list-out">
                <!-- Data Pengeluaran -->
            </div>

        </div>
        <div id="loading-indicator" style="text-align: center; padding: 40px; color: #718096;">
            Memuat data keuangan...
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzDxO8T_KJq06d5iXzu6cIVq7_LoVLOkie-P8gTAeKms5yJYkV-ppvkFy-W2k4B4Ju5Ag/exec";

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        async function fetchKeuangan() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const rows = data.value;
                if (!rows || rows.length <= 1) {
                    document.getElementById('loading-indicator').innerHTML = 'Belum ada data keuangan.';
                    return;
                }

                let totalIn = 0;
                let totalOut = 0;
                let htmlIn = '';
                let htmlOut = '';

                // Set current month string
                const now = new Date();
                const monthStr = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                document.getElementById('current-month').innerText = "Bulan Berjalan: " + monthStr;

                // Process rows (skip header)
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row[2] === "Laporan Keuangan") {
                        const jenis = (row[7] || "").toUpperCase();
                        const nominal = parseFloat(row[8]) || 0;
                        const ket = row[9] || "Tanpa Keterangan";
                        
                        let dateStr = "";
                        try {
                            const d = new Date(row[10] || row[0]);
                            dateStr = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                        } catch(e) {}

                        if (jenis === "PEMASUKAN") {
                            totalIn += nominal;
                            htmlIn += `
                                <div class="trx-item">
                                    <div class="trx-info">
                                        <div class="trx-icon icon-in">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                        </div>
                                        <div class="trx-details">
                                            <h4>${ket}</h4>
                                            <p>${dateStr}</p>
                                        </div>
                                    </div>
                                    <div class="trx-amount amount-in">+ ${formatRupiah(nominal)}</div>
                                </div>
                            `;
                        } else if (jenis === "PENGELUARAN") {
                            totalOut += nominal;
                            htmlOut += `
                                <div class="trx-item">
                                    <div class="trx-info">
                                        <div class="trx-icon icon-out">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                        </div>
                                        <div class="trx-details">
                                            <h4>${ket}</h4>
                                            <p>${dateStr}</p>
                                        </div>
                                    </div>
                                    <div class="trx-amount amount-out">- ${formatRupiah(nominal)}</div>
                                </div>
                            `;
                        }
                    }
                }

                // Update UI
                const saldoAkhir = totalIn - totalOut;
                document.getElementById('total-saldo').innerText = formatRupiah(saldoAkhir);
                document.getElementById('total-in').innerText = "+ " + formatRupiah(totalIn);
                document.getElementById('total-out').innerText = "- " + formatRupiah(totalOut);
                
                document.getElementById('list-in').innerHTML = htmlIn || '<div style="padding:20px;text-align:center;color:#718096;font-size:0.85rem;">Belum ada pemasukan</div>';
                document.getElementById('list-out').innerHTML = htmlOut || '<div style="padding:20px;text-align:center;color:#718096;font-size:0.85rem;">Belum ada pengeluaran</div>';

                document.getElementById('loading-indicator').style.display = 'none';
                document.getElementById('keuangan-content').style.display = 'block';

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('loading-indicator').innerHTML = '<span style="color:#e53e3e;">Gagal memuat data. Silakan coba lagi.</span>';
            }
        }

        fetchKeuangan();
    </script>
</body>
</html>
